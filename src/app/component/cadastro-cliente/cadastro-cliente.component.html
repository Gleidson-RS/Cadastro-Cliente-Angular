
<header>

    <title>Inicio</title>
    
    </header>
    
    <main id="geral">
    
        <div id="menu-lnk" class="menu-lnk">
            <li> <a routerLink="/" class="lnk-rota"> Inicio </a> </li>
            <li> <a routerLink="/formulario" class="lnk-rota"> formulario </a> </li>
            <li> <a routerLink="/editar" class="lnk-rota"> Edição </a> </li>
        </div>
    
    </main>
    
    <div id="form">
        <h3> Inicio </h3>
        <h3>Cadastro De Novo Cliente</h3>
    
        <form id="formulario">
            <label for="nome">Nome Completo</label>
            <input type="text" name="nome" id="nome" maxlength="30" placeholder="Informe Seu Nome Completo" [(ngModel)]="nome">
    
            <label for="email">Email</label>
            <input type="email" name="email" id="email" maxlength="30" placeholder="Informe Seu Email"  [(ngModel)]="email">
    
            <label for="cpf">CPF</label>
            <input type="text" name="cpf" id="cpf"  maxlength="14" inputmode="numeric" placeholder="Informe Seu CPF"  [(ngModel)]="cpf">
    
            <label for="data">Data de nascimento</label>
            <input type="date" name="data" id="data" maxlength="8" placeholder="Informe Sua data de nascimento"  [(ngModel)]="data">
    
            <label for="uf">Estado</label>
            <select name="uf" id="uf" placeholder="Informe Seu Estado" [(ngModel)]="uf" (change)="carregaMunicipiosSelect()" >
    
                <option value="">Selecione uma UF</option>
    
                @for (elem of listaUfs; track elem.id){
    
                    <option [ngValue]="elem.id"> {{elem.sigla}} - {{elem.nome}} </option>
    
                }
    
            </select>
    
            <label for="municipio">Município</label>
            <select name="municipio" id="municipio" placeholder="Informe Seu Município" [(ngModel)]="municipio" [disabled]="listaMunicipios.length === 0">
            
                <option value="">Selecione um Município</option>
    
                @for (elem of listaMunicipios; track elem.nome){
    
                    <option [ngValue]="elem.nome"> {{elem.nome}} </option>
    
                }
            </select>
    
    
            <div id="btns">
    
                <button routerLink="/formulario" class="lnk-rota" type="button" id="btnAdd" (click)="adicionar()" >Cadastrar</button>
                <button type="button" id="btnLimpar">Limpar tudo</button>
    
    
            </div>
        </form>
    
    </div>
